<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larrapp - Broncearte</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00bcd4">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1519046904884-53103b34b206?q=80&w=2000') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .app-card {
            background: rgba(178, 235, 242, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-location {
            background: #00e5ff;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 1.1em;
            color: #004d40;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .skin-panel {
            background: #00acc1;
            color: white;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
        }
        .slider-skin {
            -webkit-appearance: none;
            width: 100%;
            height: 30px;
            border-radius: 15px;
            background: linear-gradient(to right, #f3e5d8, #e7c1a3, #d3a17e, #b37e56, #8d5531, #2d1606);
            outline: none;
            margin: 15px 0;
        }
        .slider-skin::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .btn-calculate {
            background: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .result-area {
            background: #00bcd4;
            color: white;
            border-radius: 20px;
            margin-top: 15px;
            padding: 15px;
        }
        .instagram-link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            text-decoration: none;
            color: #004d40;
            font-weight: bold;
            font-size: 0.9em;
            transition: 0.3s;
        }
        .instagram-link:hover { opacity: 0.7; }
        .footer-info {
            font-size: 0.7em;
            margin-top: 10px;
            color: #004d40;
            cursor: pointer;
            text-decoration: underline;
            display: block;
        }
    </style>
</head>
<body>

<div class="app-card">
    <button class="btn-location" onclick="getWeather()">Detectar condiciones locales</button>
    <p style="font-size: 0.75em; color: #004d40; margin-top: 5px;">Permite tu ubicación para obtener precisión del Índice UV.</p>

    <div class="skin-panel">
        <strong>Tonalidad de piel</strong>
        <input type="range" id="skinRange" min="0" max="5" value="1" class="slider-skin">
        <p style="font-size: 0.7em;">mueve el punto blanco a tu tono</p>
    </div>

    <button class="btn-calculate" onclick="calculateTime()">CALCULAR</button>

    <div class="result-area">
        <div id="final-time" style="font-size: 1.4em; font-weight: bold;">-- min totales</div>
        <div id="sides" style="font-size: 0.85em;"></div>
    </div>

    <a href="https://www.instagram.com/gonza_larra00/" target="_blank" class="instagram-link">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" width="20" style="margin-right: 8px;">
        @gonza_larra00
    </a>

    <span class="footer-info" onclick="alert('Fuentes: Open-Meteo API. Metodología: Escala Fitzpatrick y OMS.')">
        Información sobre los datos y fuentes oficiales
    </span>
</div>

<script>
    let currentUV = 5;

    async function getWeather() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const { latitude, longitude } = position.coords;
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=uv_index_max&timezone=auto`);
                    const data = await res.json();
                    currentUV = data.daily.uv_index_max[0];
                    alert("Índice UV detectado: " + currentUV);
                } catch (e) {
                    alert("Error al conectar con el clima.");
                }
            }, () => alert("Por favor, activa el GPS."));
        }
    }

    function calculateTime() {
        const skinType = document.getElementById('skinRange').value;
        const dem = [200, 300, 450, 600, 900, 1200]; 
        let totalMinutes = Math.round(dem[skinType] / (currentUV * 10));
        
        document.getElementById('final-time').innerText = totalMinutes + " min totales";
        document.getElementById('sides').innerText = 
            Math.round(totalMinutes/2) + " min de frente / " + Math.round(totalMinutes/2) + " min de espalda";
    }
</script>

</body>
</html>
